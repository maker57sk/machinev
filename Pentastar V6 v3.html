<three-d-stage name="challenger-pentastar-3.6-v6" background="#f2f2f3" autorotate></three-d-stage>
<div class="card blueprint plate">

<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const M = (name, color, roughness, metalness) => {
  const m = new THREE.MeshStandardMaterial({ color, roughness, metalness });
  m.name = name; return m;
};
const aluminum = M('cast_aluminum', 0xbfc3c7, 0.55, 0.3);
const composite = M('black_composite', 0x2b2d30, 0.62, 0.05);
const steel = M('machined_steel', 0x9aa0a6, 0.32, 0.4);
const iron = M('dark_iron', 0x55595e, 0.5, 0.35);
const rubber = M('rubber', 0x161718, 0.9, 0.0);
const accent = M('steel_blue', 0x5980a6, 0.45, 0.1);

const engine = new THREE.Group(); engine.name = 'pentastar_3_6_v6';
const mesh = (name, geo, mat, parent = engine) => {
  const m = new THREE.Mesh(geo, mat); m.name = name; m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
};
const zCyl = (r, len, seg = 48) => new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2);
const roundedRect = (w, h, r) => {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
};
const extrudeZ = (shape, depth, bevel = 0.004) => {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 16 });
  g.translate(0, 0, -depth / 2); return g;
};

const CRANK_Y = 0.22, BORE_PITCH = 0.104, STAGGER = 0.022;

// Oil pan
{
  const s = new THREE.Shape();
  s.moveTo(-0.17, 0.10); s.lineTo(0.17, 0.10); s.lineTo(0.15, 0.03);
  s.quadraticCurveTo(0.14, 0.0, 0.11, 0.0); s.lineTo(-0.11, 0.0);
  s.quadraticCurveTo(-0.14, 0.0, -0.15, 0.03); s.closePath();
  mesh('oil_pan', extrudeZ(s, 0.44, 0.004).translate(0, 0.004, 0), aluminum);
  mesh('oil_pan_rail', new THREE.BoxGeometry(0.36, 0.012, 0.47).translate(0, 0.108, 0), aluminum);
  mesh('drain_plug', new THREE.CylinderGeometry(0.009, 0.009, 0.01, 6).translate(0.05, 0.0, -0.1), steel);
}

// Lower block / crankcase
mesh('block_crankcase', new THREE.BoxGeometry(0.34, 0.18, 0.46).translate(0, 0.203, 0), aluminum);
for (const x of [-1, 1]) for (const y of [0.16, 0.24]) {
  mesh(`block_rib_${x > 0 ? 'R' : 'L'}_${y}`, new THREE.BoxGeometry(0.008, 0.012, 0.44).translate(x * 0.172, y, 0), aluminum);
}
for (const x of [-1, 1]) {
  mesh(`engine_mount_${x > 0 ? 'R' : 'L'}`, new THREE.BoxGeometry(0.04, 0.08, 0.1).translate(x * 0.19, 0.22, 0.04), iron);
}
// Starter
{
  const st = new THREE.Group(); st.name = 'starter'; st.position.set(0.205, 0.13, -0.15); engine.add(st);
  mesh('starter_motor', zCyl(0.042, 0.14), iron, st);
  mesh('starter_solenoid', zCyl(0.022, 0.1).translate(0, 0.05, -0.01), iron, st);
}

// Cylinder banks (60° V)
const buildBank = (side) => {
  const bank = new THREE.Group(); const tag = side > 0 ? 'R' : 'L';
  bank.name = `bank_${tag}`; bank.position.set(0, CRANK_Y, side * STAGGER);
  bank.rotation.z = -side * Math.PI / 6; engine.add(bank);
  mesh(`block_bank_${tag}`, new THREE.BoxGeometry(0.17, 0.2, 0.44).translate(0, 0.1, 0), aluminum, bank);
  mesh(`cylinder_head_${tag}`, new THREE.BoxGeometry(0.205, 0.1, 0.47).translate(0, 0.25, 0), aluminum, bank);
  mesh(`head_gasket_${tag}`, new THREE.BoxGeometry(0.2, 0.004, 0.46).translate(0, 0.2, 0), iron, bank);
  // Cam cover: rounded-top section extruded along z
  const cs = new THREE.Shape();
  cs.moveTo(-0.1, 0.0); cs.lineTo(0.1, 0.0); cs.lineTo(0.1, 0.02);
  cs.quadraticCurveTo(0.1, 0.05, 0.07, 0.052); cs.lineTo(-0.07, 0.052);
  cs.quadraticCurveTo(-0.1, 0.05, -0.1, 0.02); cs.closePath();
  mesh(`cam_cover_${tag}`, extrudeZ(cs, 0.44, 0.005).translate(0, 0.302, 0), composite, bank);
  // Cam cover bolts
  for (let i = 0; i < 6; i++) for (const bx of [-0.09, 0.09]) {
    mesh(`cam_cover_bolt_${tag}_${i}_${bx > 0 ? 'o' : 'i'}`, new THREE.CylinderGeometry(0.006, 0.006, 0.008, 6).translate(bx, 0.33, -0.2 + i * 0.08), steel, bank);
  }
  // Coil-on-plug packs
  for (let c = 0; c < 3; c++) {
    const z = (c - 1) * BORE_PITCH;
    mesh(`ignition_coil_${tag}${c + 1}`, new THREE.CylinderGeometry(0.018, 0.02, 0.03, 24).translate(side * 0.035, 0.37, z), composite, bank);
    mesh(`coil_connector_${tag}${c + 1}`, new THREE.BoxGeometry(0.025, 0.018, 0.03).translate(side * 0.06, 0.37, z), accent, bank);
  }
  // Exhaust outlet from integrated manifold (rear, outboard)
  mesh(`heat_shield_${tag}`, new THREE.BoxGeometry(0.004, 0.09, 0.36).translate(side * 0.108, 0.25, 0.02), steel, bank);
  // Oil fill cap (right bank)
  if (side > 0) {
    mesh('oil_fill_neck', new THREE.CylinderGeometry(0.022, 0.022, 0.02, 32).translate(-0.02, 0.36, 0.16), composite, bank);
    mesh('oil_fill_cap', new THREE.CylinderGeometry(0.028, 0.028, 0.014, 32).translate(-0.02, 0.375, 0.16), accent, bank);
  }
  return bank;
};
buildBank(1); buildBank(-1);

// Lower + upper intake
mesh('lower_intake', new THREE.BoxGeometry(0.16, 0.08, 0.4).translate(0, 0.52, 0), aluminum);
{
  const intake = new THREE.Group(); intake.name = 'upper_intake'; engine.add(intake);
  mesh('intake_plenum', extrudeZ(roundedRect(0.22, 0.1, 0.04), 0.4, 0.008).translate(0, 0.615, -0.01), composite, intake);
  for (let i = 0; i < 4; i++) {
    mesh(`plenum_rib_${i}`, new THREE.BoxGeometry(0.006, 0.01, 0.34).translate(-0.06 + i * 0.04, 0.673, -0.01), composite, intake);
  }
  mesh('badge_plate', extrudeZ(roundedRect(0.11, 0.06, 0.01), 0.004, 0.002).rotateX(-Math.PI / 2).translate(0, 0.672, 0.13), steel, intake);
  for (const side of [-1, 1]) for (let c = 0; c < 3; c++) {
    const z = (c - 1) * BORE_PITCH + side * STAGGER + 0.04;
    const pts = [[0.09, 0.64], [0.19, 0.655], [0.245, 0.61], [0.225, 0.56], [0.13, 0.545], [0.07, 0.535]]
      .map(([x, y]) => new THREE.Vector3(side * x, y, z));
    mesh(`intake_runner_${side > 0 ? 'R' : 'L'}${c + 1}`, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.021, 24, false), composite, intake);
  }
  // Throttle body, front of plenum
  const tb = new THREE.Group(); tb.name = 'throttle_body'; tb.position.set(0.02, 0.615, 0.235); intake.add(tb);
  mesh('throttle_housing', zCyl(0.042, 0.06), aluminum, tb);
  mesh('throttle_inlet_ring', new THREE.TorusGeometry(0.042, 0.007, 16, 48).translate(0, 0, 0.03), aluminum, tb);
  mesh('throttle_bore', zCyl(0.034, 0.002).translate(0, 0, 0.0305), iron, tb);
  mesh('throttle_actuator', new THREE.BoxGeometry(0.05, 0.07, 0.05).translate(-0.06, -0.01, -0.005), composite, tb);
}

// Front timing cover
const FRONT = 0.25;
{
  const s = new THREE.Shape();
  [[-0.16, 0.085], [0.16, 0.085], [0.18, 0.26], [0.275, 0.46], [0.255, 0.5], [0.09, 0.585], [-0.09, 0.585], [-0.255, 0.5], [-0.275, 0.46], [-0.18, 0.26]]
    .forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
  s.closePath();
  mesh('timing_cover', extrudeZ(s, 0.026, 0.004).translate(0, 0, FRONT + 0.013), aluminum);
  // Cam phaser bulges (4)
  for (const side of [-1, 1]) for (const lx of [-0.05, 0.05]) {
    const a = -side * Math.PI / 6, ly = 0.265;
    const x = lx * Math.cos(a) - ly * Math.sin(a), y = lx * Math.sin(a) + ly * Math.cos(a) + CRANK_Y;
    mesh(`cam_phaser_cover_${side > 0 ? 'R' : 'L'}_${lx > 0 ? 'ex' : 'in'}`, zCyl(0.042, 0.016).translate(x, y, FRONT + 0.034), aluminum);
  }
  mesh('front_crank_seal', zCyl(0.05, 0.01).translate(0, CRANK_Y, FRONT + 0.032), iron);
}

// Rear flange + flexplate
{
  const s = new THREE.Shape();
  [[-0.19, 0.06], [0.19, 0.06], [0.22, 0.26], [0.26, 0.42], [0.1, 0.5], [-0.1, 0.5], [-0.26, 0.42], [-0.22, 0.26]]
    .forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));
  s.closePath();
  mesh('bellhousing_flange', extrudeZ(s, 0.014, 0.003).translate(0, 0, -0.245), aluminum);
  mesh('flexplate', zCyl(0.15, 0.006, 64).translate(0, CRANK_Y, -0.258), iron);
  mesh('flexplate_hub', zCyl(0.04, 0.014).translate(0, CRANK_Y, -0.262), steel);
}

// Accessories
const PZ = FRONT + 0.07;
const pulleys = [
  { name: 'crank_damper', x: 0, y: CRANK_Y, r: 0.09 },
  { name: 'belt_tensioner', x: 0.17, y: 0.245, r: 0.035 },
  { name: 'alternator_pulley', x: 0.3, y: 0.4, r: 0.032 },
  { name: 'idler_pulley', x: 0.0, y: 0.49, r: 0.035 },
  { name: 'water_pump_pulley', x: -0.16, y: 0.42, r: 0.06 },
  { name: 'ac_compressor_pulley', x: -0.25, y: 0.2, r: 0.06 },
];
for (const p of pulleys) {
  const g = new THREE.Group(); g.name = p.name; g.position.set(p.x, p.y, PZ); engine.add(g);
  mesh(`${p.name}_groove`, zCyl(p.r - 0.001, 0.024, 64), steel, g);
  mesh(`${p.name}_flange_f`, zCyl(p.r + 0.007, 0.004, 64).translate(0, 0, 0.014), steel, g);
  mesh(`${p.name}_flange_r`, zCyl(p.r + 0.007, 0.004, 64).translate(0, 0, -0.014), steel, g);
  mesh(`${p.name}_hub`, zCyl(Math.min(0.025, p.r * 0.45), 0.008).translate(0, 0, 0.019), iron, g);
}
mesh('crank_damper_ring', zCyl(0.085, 0.03, 64).translate(0, CRANK_Y, PZ - 0.03), iron);
mesh('crank_bolt', new THREE.CylinderGeometry(0.012, 0.012, 0.01, 6).rotateX(Math.PI / 2).translate(0, CRANK_Y, PZ + 0.027), steel);
mesh('tensioner_arm', new THREE.BoxGeometry(0.03, 0.09, 0.012).rotateZ(0.5).translate(0.15, 0.2, FRONT + 0.045), iron);
mesh('water_pump_housing', zCyl(0.05, 0.04).translate(-0.16, 0.42, FRONT + 0.045), aluminum);
mesh('idler_bracket', zCyl(0.02, 0.04).translate(0, 0.49, FRONT + 0.045), aluminum);
{
  const alt = new THREE.Group(); alt.name = 'alternator'; alt.position.set(0.3, 0.4, 0.2); engine.add(alt);
  mesh('alternator_body', zCyl(0.075, 0.13), steel, alt);
  mesh('alternator_front_frame', zCyl(0.07, 0.02).translate(0, 0, 0.075), aluminum, alt);
  for (let i = 0; i < 5; i++) mesh(`alternator_fin_${i}`, new THREE.TorusGeometry(0.076, 0.003, 8, 48).translate(0, 0, -0.05 + i * 0.025), aluminum, alt);
  mesh('alternator_bracket', new THREE.BoxGeometry(0.1, 0.03, 0.08).translate(-0.07, -0.05, 0), aluminum, alt);
}
{
  const ac = new THREE.Group(); ac.name = 'ac_compressor'; ac.position.set(-0.25, 0.2, 0.17); engine.add(ac);
  mesh('ac_compressor_body', zCyl(0.068, 0.17), aluminum, ac);
  mesh('ac_clutch', zCyl(0.062, 0.03).translate(0, 0, 0.1), steel, ac);
  mesh('ac_manifold_block', new THREE.BoxGeometry(0.05, 0.03, 0.06).translate(-0.02, 0.075, -0.03), aluminum, ac);
}

// Serpentine belt: offset hull around pulleys (listed CCW)
{
  const T = 0.007, arcs = [];
  const n = pulleys.length;
  const tangentAngle = (a, b) => {
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    return Math.atan2(dy, dx) - Math.acos((a.r - b.r) / L);
  };
  for (let i = 0; i < n; i++) {
    const prev = pulleys[(i - 1 + n) % n], cur = pulleys[i], next = pulleys[(i + 1) % n];
    let a0 = tangentAngle(prev, cur), a1 = tangentAngle(cur, next);
    while (a1 < a0) a1 += Math.PI * 2;
    arcs.push({ p: cur, a0, a1 });
  }
  const ring = (rOff) => {
    const pts = [];
    for (const { p, a0, a1 } of arcs) {
      const steps = Math.max(4, Math.ceil((a1 - a0) / 0.08));
      for (let k = 0; k <= steps; k++) {
        const a = a0 + (a1 - a0) * k / steps;
        pts.push(new THREE.Vector2(p.x + (p.r + rOff) * Math.cos(a), p.y + (p.r + rOff) * Math.sin(a)));
      }
    }
    return pts;
  };
  const shape = new THREE.Shape(ring(T));
  shape.holes.push(new THREE.Path(ring(0.0005).reverse()));
  mesh('serpentine_belt', new THREE.ExtrudeGeometry(shape, { depth: 0.022, bevelEnabled: false }).translate(0, 0, PZ - 0.011), rubber);
}

// Dipstick
{
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.172, 0.18, 0.12), new THREE.Vector3(-0.2, 0.3, 0.14),
    new THREE.Vector3(-0.235, 0.45, 0.16), new THREE.Vector3(-0.24, 0.53, 0.17),
  ]);
  mesh('dipstick_tube', new THREE.TubeGeometry(curve, 32, 0.006, 12, false), steel);
  mesh('dipstick_handle', new THREE.TorusGeometry(0.018, 0.005, 12, 32).rotateY(Math.PI / 2).translate(-0.24, 0.555, 0.17), accent);
}

// Coolant hose from water pump up to thermostat housing
{
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.16, 0.47, FRONT + 0.03), new THREE.Vector3(-0.14, 0.55, FRONT + 0.02),
    new THREE.Vector3(-0.08, 0.58, FRONT - 0.02), new THREE.Vector3(-0.07, 0.56, FRONT - 0.07),
  ]);

const WORKLET = `
class V6 extends AudioWorkletProcessor {
  static get parameterDescriptors() { return [
    { name: 'rpm', defaultValue: 0, minValue: 0, maxValue: 9000, automationRate: 'k-rate' },
    { name: 'load', defaultValue: 0, minValue: 0, maxValue: 1, automationRate: 'k-rate' },
    { name: 'fuel', defaultValue: 0, minValue: 0, maxValue: 1, automationRate: 'k-rate' } ]; }
  constructor() { super(); this.ph = 0; this.cyl = 0; this.p = []; this.g = [1, 0.9, 1.07, 0.93, 1.03, 0.87]; this.env = 0; this.r = 0; this.l = 0; }
  process(_, outs, prm) {
    const o = outs[0], A = o[0], B = o[1] || o[0], n = A.length;
    const rT = prm.rpm[0], lT = prm.load[0], fuel = prm.fuel[0];
    for (let i = 0; i < n; i++) {
      this.r += (rT - this.r) * 0.0006; this.l += (lT - this.l) * 0.0006;
      const hz = this.r / 20, prev = this.ph;
      this.ph += hz / sampleRate * (1 + (Math.random() - 0.5) * 0.02);
      if (Math.floor(this.ph) !== Math.floor(prev) && hz > 1) {
        const c = this.cyl = (this.cyl + 1) % 6;
        const len = Math.max(48, Math.min(sampleRate / hz * 0.95, sampleRate * 0.022));
        let a;
        if (fuel > 0.5) {
          a = this.g[c] * (0.3 + 0.7 * this.l) * (1 + (Math.random() - 0.5) * 0.14);
          if (this.l < 0.05 && this.r > 1800 && Math.random() < 0.04) a *= 1.9;
        } else a = 0.16 * this.g[c];
        this.p.push({ t: 0, len, a, k: 1.3 + Math.random() * 0.4 });
        this.env = Math.max(this.env, a);
      }
      let s = 0;
      for (let k = this.p.length - 1; k >= 0; k--) {
        const q = this.p[k], x = q.t / q.len;
        const e = x < 0.06 ? x / 0.06 : Math.exp(-(x - 0.06) * 5.5);
        s += q.a * e * Math.cos(6.2832 * x * q.k);
        if (++q.t >= q.len) this.p.splice(k, 1);
      }
      this.env *= 0.9992;
      A[i] = s; B[i] = (Math.random() * 2 - 1) * this.env;
    }
    return true;
  }
}
registerProcessor('v6-engine', V6);`;

let audio = null;
async function initAudio() {
  if (audio) { if (audio.ctx.state !== 'running') await audio.ctx.resume(); return; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' })));
  const node = new AudioWorkletNode(ctx, 'v6-engine', { numberOfOutputs: 1, outputChannelCount: [2] });
  const split = ctx.createChannelSplitter(2); node.connect(split);
  const F = (type, f, q = 0.7, g = 0) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.gain.value = g; return b; };
  const G = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const hp = F('highpass', 28);
  const shaper = ctx.createWaveShaper(); const curve = new Float32Array(2048);
  for (let i = 0; i < 2048; i++) { const x = i / 1023.5 - 1; curve[i] = Math.tanh(2.6 * x) / Math.tanh(2.6); }
  shaper.curve = curve; shaper.oversample = '2x';
  const lp = F('lowpass', 600, 1.2), body = F('peaking', 115, 1, 6), comb = G(0.55);
  const rasp = F('bandpass', 420, 2.4), raspG = G(0.12);
  const nbp = F('bandpass', 1400, 0.6), intake = G(0.05);
  const master = G(0.7), comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.15;
  split.connect(hp, 0); hp.connect(shaper); shaper.connect(lp); lp.connect(body); body.connect(comb); comb.connect(master);
  shaper.connect(rasp); rasp.connect(raspG); raspG.connect(master);
  split.connect(nbp, 1); nbp.connect(intake); intake.connect(master);
  const motor = ctx.createOscillator(); motor.type = 'sawtooth'; motor.frequency.value = 95;
  const whine = ctx.createOscillator(); whine.type = 'square'; whine.frequency.value = 1350;
  const sbp = F('bandpass', 900, 1.1), starter = G(0);
  motor.connect(sbp); const wg = G(0.25); whine.connect(wg); wg.connect(sbp); sbp.connect(starter); starter.connect(master);
  motor.start(); whine.start();
  master.connect(comp); comp.connect(ctx.destination);
  audio = { ctx, node, lp, rasp, raspG, nbp, intake, master, starter, motor, whine, comb };
  setVolume();
}
function setVolume() { ui.volVal.textContent = ui.vol.value + '%'; if (audio) audio.master.gain.setTargetAtTime((ui.vol.value / 100) ** 1.5, audio.ctx.currentTime, 0.05); }

function pushAudio() {
  if (!audio) return;
  const t = audio.ctx.currentTime, P = audio.node.parameters, r = S.rpm, l = S.load;
  P.get('rpm').setValueAtTime(r, t); P.get('load').setValueAtTime(l, t); P.get('fuel').setValueAtTime(S.fuel, t);
  audio.lp.frequency.setTargetAtTime(260 + r * 0.32 + l * 2200, t, 0.03);
  audio.rasp.frequency.setTargetAtTime(320 + r * 0.09, t, 0.03);
  audio.raspG.gain.setTargetAtTime(S.fuel ? 0.06 + l * 0.3 : 0.02, t, 0.04);
  audio.nbp.frequency.setTargetAtTime(900 + r * 0.45, t, 0.05);
  audio.intake.gain.setTargetAtTime(S.fuel ? 0.03 + l * 0.35 * Math.min(1, r / 3000) : 0.01, t, 0.05);
  const crank = S.mode === 'cranking';
  audio.starter.gain.setTargetAtTime(crank ? 0.22 : 0, t, crank ? 0.02 : 0.08);
  if (crank) { audio.motor.frequency.setTargetAtTime(85 + S.rpm * 0.06, t, 0.02); audio.whine.frequency.setTargetAtTime(1250 + S.rpm * 0.6, t, 0.02); }
}

function step(dt) {
  const input = Math.max(ui.thr.value / 100, S.hold || S.key ? 1 : 0);
  const canRev = S.mode === 'running';
  S.pedal += ((canRev ? input : 0) - S.pedal) * Math.min(1, dt * 9);
  if (S.mode === 'cranking') {
    S.t += dt; S.fuel = 0; S.load = 0;
    S.rpm = 200 + 70 * Math.sin(S.t * Math.PI * 2 * 5.5) + S.t * 40;
    if (S.t > 1.0) { S.mode = 'running'; S.flare = 1100; S.fuel = 1; }
  } else if (S.mode === 'running') {
    S.flare *= Math.exp(-dt * 1.4);
    const idle = IDLE + Math.sin(performance.now() / 700) * 12 + (Math.random() - 0.5) * 10;
    let target = idle + S.flare + S.pedal * (LIMIT + 300 - idle);
    if (S.rpm >= LIMIT) S.cut = 0.075;
    const diff = target - S.rpm;
    if (S.cut > 0) { S.cut -= dt; S.fuel = 0; S.rpm -= 2600 * dt; S.load = 0; }
    else {
      S.fuel = 1;
      const torque = 0.75 + 0.25 * Math.sin(Math.min(1, S.rpm / 5200) * Math.PI);
      if (diff > 0) S.rpm += Math.min(diff * 5.5, 6800 * torque) * dt;
      else S.rpm += Math.max(diff * 2.4, -3200) * dt;
      S.load = Math.max(0, Math.min(1, S.pedal * 0.7 + (diff > 0 ? Math.min(diff / 2500, 1) * 0.4 : 0)));
    }
  } else if (S.mode === 'stopping') {
    S.fuel = 0; S.load = 0;
    S.rpm -= (350 + S.rpm * 1.6) * dt;
    if (S.rpm <= 0) { S.rpm = 0; S.mode = 'off'; updateUI(); }
  }
}

function animate(dt, now) {
  const w = S.rpm / 60 * Math.PI * 2 * 0.05;
  for (const s of spinners) if (s.obj) s.obj.rotation.z -= w * s.ratio * dt;
  const rough = S.mode === 'cranking' ? 0.0035 : S.mode === 'running' ? (S.rpm < 1000 ? 0.0012 : 0.0006) + S.load * 0.0008 : S.mode === 'stopping' ? 0.002 : 0;
  S.roll += (((S.mode === 'running' ? -S.load * 0.022 : 0)) - S.roll) * Math.min(1, dt * 6);
  const tt = now / 1000;
  engine.position.set(basePos.x + Math.sin(tt * 53) * rough * 0.6, basePos.y + Math.sin(tt * 71 + 1) * Math.sin(tt * 29) * rough, basePos.z + Math.sin(tt * 41) * rough * 0.4);
  engine.rotation.set(baseRot.x + Math.sin(tt * 47) * rough * 1.5, baseRot.y, baseRot.z + S.roll + Math.sin(tt * 61) * rough * 2.5);
}

let lastUI = '';
function updateUI() {
  const on = S.mode === 'running' || S.mode === 'cranking';
  const state = S.mode + on;
  if (state !== lastUI) {
    lastUI = state;
    ui.startLabel.textContent = on ? 'Stop engine' : 'Start engine';
    ui.rev.disabled = S.mode !== 'running';
    ui.status.textContent = { off: 'Off', cranking: 'Cranking', running: 'Running', stopping: 'Shutting down' }[S.mode];
    ui.status.className = 'tag ' + (S.mode === 'running' ? 'tag-accent' : S.mode === 'off' ? 'tag-neutral' : 'tag-outline');
  }
  ui.rpm.textContent = Math.round(S.rpm / 10) * 10;
  ui.fill.style.width = Math.min(100, S.rpm / TACH_MAX * 100) + '%';
  ui.tach.classList.toggle('limit', S.rpm > LIMIT - 150);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); animate(dt, now); pushAudio(); updateUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

async function toggleEngine() {
  if (S.mode === 'running' || S.mode === 'cranking') { S.mode = 'stopping'; S.hold = S.key = false; ui.rev.classList.remove('held'); return; }
  if (S.mode === 'stopping' && S.rpm > 50) return;
  try { await initAudio(); } catch (e) { console.warn('Audio unavailable', e); }
  S.mode = 'cranking'; S.t = 0;
}
ui.start.addEventListener('click', toggleEngine);
const hold = v => { S.hold = v && S.mode === 'running'; ui.rev.classList.toggle('held', S.hold); };
ui.rev.addEventListener('pointerdown', e => { ui.rev.setPointerCapture(e.pointerId); hold(true); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => ui.rev.addEventListener(ev, () => hold(false)));
ui.thr.addEventListener('input', () => ui.thrVal.textContent = ui.thr.value + '%');
ui.vol.addEventListener('input', setVolume);
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat && S.mode === 'running') { S.key = true; ui.rev.classList.add('held'); } }
  else if (e.code === 'KeyS' && !e.repeat) toggleEngine();
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { S.key = false; if (!S.hold) ui.rev.classList.remove('held'); } });
addEventListener('blur', () => { S.key = false; hold(false); });

</script>
</body>
