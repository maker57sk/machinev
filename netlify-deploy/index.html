document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — ); }\n  .m-tabs button:active { background: var(--color-accent-200); }\n  .m-tabs button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n  .m-tabs button.on { color: var(--color-text); box-shadow: inset 0 2px 0 var(--color-accent); }\n  body.m-app .m-sheet { display: flex; flex-direction: column; position: fixed; z-index: 5; left: 0; right: 0; bottom: calc(56px + env(safe-area-inset-bottom)); max-height: 66vh; max-height: 66svh; background: var(--color-bg); border-top: 1px solid var(--color-accent); box-shadow: var(--shadow-lg); transform: translateY(calc(100% + 80px)); visibility: hidden; transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility 0s .26s; }\n  body.m-app .m-sheet.open { transform: translateY(var(--m-drag, 0px)); visibility: visible; transition: transform .26s cubic-bezier(.2, .8, .2, 1); }\n  body.m-app .m-sheet.dragging { transition: none; }\n  .m-grab { touch-action: none; }\n  .m-handle { height: 18px; display: grid; place-items: center; } .m-handle i { width: 36px; height: 4px; background: var(--color-accent-300); }\n  .m-sheet-head { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 0 12px 10px 16px; }\n  .m-title { font-family: var(--font-heading); font-size: 26px; font-weight: 600; text-transform: uppercase; line-height: 1; }\n  .m-rev { height: 40px; user-select: none; -webkit-user-select: none; touch-action: none; }\n  .m-close { width: 40px; height: 40px; }\n  .m-sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 20px; }\n  .m-sheet-body > [data-mpane] { display: none; } .m-sheet-body > [data-mpane].on { display: block; }\n  body.m-app .m-sheet .card { border: 0; padding: 0; box-shadow: none; background: none; }\n  body.m-app .m-sheet .card > .corner { display: none; }\n  body.m-app .m-sheet .console > .cluster, body.m-app .m-sheet .console > .ctrl-row, body.m-app .m-sheet #selector, body.m-app .m-sheet .keys, body.m-app .m-sheet .console > .console-head, body.m-app .m-sheet #hint, body.m-app .m-sheet .tabs, body.m-app .m-sheet .settings .card-kicker { display: none; }\n  body.m-app .m-sheet .settings > .console-head { justify-content: flex-end; }\n  body.m-app .m-sheet .plate { pointer-events: auto; }\n  body.m-app .m-sheet .plate .specs { display: grid; }\n  body.m-app .m-sheet .plate .card-title { font-size: 28px; margin: 4px 0 10px; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<three-d-stage name=\"challenger-pentastar-3.6-v6\" background=\"#f2f2f3\" autorotate=\"\"><\u002Fthree-d-stage>\n<div class=\"left\">\n<div class=\"card blueprint plate\">\n  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n  <div class=\"seg full engine-seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"engine\" value=\"v6\" checked=\"\">3.6 V6<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"engine\" value=\"v8\">5.7 V8<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"engine\" value=\"i6\">BMW 3.0d<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"engine\" value=\"m156\">AMG M156<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"engine\" value=\"f140\">Ferrari F140<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"engine\" value=\"w12\">Bentley W12<\u002Flabel><\u002Fdiv>\n  <div class=\"card-kicker\" id=\"plateKicker\">Dodge Challenger SXT / GT<\u002Fdiv>\n  <div class=\"card-title\" id=\"plateTitle\">3.6L Pentastar V6<\u002Fdiv>\n  <dl class=\"specs\" id=\"plateSpecs\">\n    <dt>Layout<\u002Fdt><dd>60° V6, DOHC 24-valve<\u002Fdd>\n    <dt>Displacement<\u002Fdt><dd>3,604 cc<\u002Fdd>\n    <dt>Bore × stroke<\u002Fdt><dd>96 × 83 mm<\u002Fdd>\n    <dt>Output<\u002Fdt><dd>303 hp · 268 lb-ft<\u002Fdd>\n    <dt>Construction<\u002Fdt><dd>Aluminum block &amp; heads<\u002Fdd>\n  <\u002Fdl>\n<\u002Fdiv>\n<div class=\"card blueprint settings\" id=\"settings\">\n  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n  <div class=\"console-head\"><div class=\"card-kicker\">Settings<\u002Fdiv><button class=\"btn btn-ghost tbtn\" id=\"resetTab\" type=\"button\">Reset tab<\u002Fbutton><\u002Fdiv>\n  <div class=\"scenes\" data-help=\"One-tap setups that change several settings at once. You can still tweak anything afterwards.\"><span>Scenes<\u002Fspan><div class=\"scene-row\"><button class=\"btn btn-secondary tbtn\" type=\"button\" data-scene=\"showroom\">Showroom<\u002Fbutton><button class=\"btn btn-secondary tbtn\" type=\"button\" data-scene=\"burnout\">Night burnout<\u002Fbutton><button class=\"btn btn-secondary tbtn\" type=\"button\" data-scene=\"drag\">Drag strip<\u002Fbutton><button class=\"btn btn-secondary tbtn\" type=\"button\" data-scene=\"study\">Blueprint study<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n  <div class=\"seg full tabs\"><label class=\"seg-opt\"><input type=\"radio\" name=\"tab\" value=\"view\" checked=\"\">View<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"tab\" value=\"look\">Look<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"tab\" value=\"drive\">Drive<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"tab\" value=\"sound\">Sound<\u002Flabel><\u002Fdiv>\n  <div class=\"tabpane\" data-tab=\"view\">\n    <div class=\"vrow\" data-help=\"Cutaway slices the block open so you can watch the pistons, crank and valves move.\"><span>Mode<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"cut\" value=\"0\" checked=\"\">Solid<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"cut\" value=\"1\">Cutaway<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <label class=\"slider off\" data-help=\"How deep the cutaway slice goes. Only active in Cutaway mode.\" id=\"sectionWrap\"><div><span>Cut depth<\u002Fspan><span id=\"secVal\">50%<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"section\" min=\"0\" max=\"100\" value=\"50\" disabled=\"\"><\u002Flabel>\n    <label class=\"slider\" data-help=\"Pulls the parts apart so you can see how the engine goes together.\"><div><span>Exploded<\u002Fspan><span id=\"expVal\">0%<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"explode\" min=\"0\" max=\"100\" value=\"0\"><\u002Flabel>\n    <div class=\"vrow\" data-help=\"Places the engine in the Challenger engine bay with radiator, fan and inner fenders.\"><span>Engine bay<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"bay\" value=\"0\" checked=\"\">Off<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"bay\" value=\"1\">On<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Shows the name and purpose of any part under your pointer.\"><span>Hover labels<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"labels\" value=\"1\" checked=\"\">On<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"labels\" value=\"0\">Off<\u002Flabel><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tabpane\" data-tab=\"look\" hidden=\"\">\n    <div class=\"vrow stack\" data-help=\"Studio is bright and even. Garage night is dark with a single overhead lamp.\"><span>Lighting<\u002Fspan><div class=\"seg full\"><label class=\"seg-opt\"><input type=\"radio\" name=\"light\" value=\"studio\" checked=\"\">Studio<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"light\" value=\"night\">Garage night<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Grid adds a drafting-paper backdrop and a measured floor under the engine. Each floor square is 10 cm.\"><span>Background<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"bg\" value=\"grid\" checked=\"\">Grid<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"bg\" value=\"plain\">Plain<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Blueprint draws the engine as line work, like a technical drawing.\"><span>Render<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"render\" value=\"shaded\" checked=\"\">Shaded<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"render\" value=\"blueprint\">Blueprint<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Exhaust parts glow red-hot at high revs under load. Watch the exhaust temp climb.\"><span>Heat glow<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"heat\" value=\"1\" checked=\"\">On<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"heat\" value=\"0\">Off<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Exhaust gas temperature. Glow starts around 500°C.\"><span>Exhaust temp<\u002Fspan><b id=\"egtVal\">25°C<\u002Fb><\u002Fdiv>\n    <div class=\"vrow stack\" data-help=\"Finish of the aluminum block, heads and housings.\"><span>Block &amp; heads<\u002Fspan><div class=\"seg full\"><label class=\"seg-opt\"><input type=\"radio\" name=\"block\" value=\"cast\" checked=\"\">Cast<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"block\" value=\"polished\">Polished<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"block\" value=\"black\">Black<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow stack\" data-help=\"Color of the engine covers and black plastic parts.\"><span>Covers<\u002Fspan><div class=\"seg full\"><label class=\"seg-opt\"><input type=\"radio\" name=\"covers\" value=\"black\" checked=\"\">Black<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"covers\" value=\"steel\">Steel<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"covers\" value=\"silver\">Silver<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Body color of the engine bay. Turn on Engine bay in the View tab to see it.\"><span>Bay paint<\u002Fspan><select class=\"input\" id=\"paintSel\">\n      <option value=\"steel\" selected=\"\">Steel blue<\u002Foption><option value=\"torred\">TorRed<\u002Foption><option value=\"mango\">Go Mango<\u002Foption><option value=\"sublime\">Sublime<\u002Foption><option value=\"b5\">B5 Blue<\u002Foption><option value=\"white\">White Knuckle<\u002Foption><option value=\"black\">Pitch Black<\u002Foption>\n    <\u002Fselect><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tabpane\" data-tab=\"drive\" hidden=\"\">\n    <div class=\"runs\" data-help=\"Times start automatically when you pull away from a stop.\">\n      <div><span>0–60 mph<\u002Fspan><b id=\"t60\">—<\u002Fb><small id=\"b60\">best —<\u002Fsmall><\u002Fdiv>\n      <div><span>¼ mile<\u002Fspan><b id=\"tq\">—<\u002Fb><small id=\"bq\">best —<\u002Fsmall><\u002Fdiv>\n      <div><span>Trap<\u002Fspan><b id=\"trap\">—<\u002Fb><small id=\"dist\">ready<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Hold the brake (or clutch) at full throttle; revs hold steady. Release to launch.\"><span>Launch control<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"launch\" value=\"0\" checked=\"\">Off<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"launch\" value=\"1\">On<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Cuts power when the rear tires spin. Turn off for burnouts.\"><span>Traction control<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"tc\" value=\"0\">Off<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"tc\" value=\"1\" checked=\"\">On<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Brake holds only the front wheels, so the rears can spin. Use with traction off.\"><span>Line lock<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"lock\" value=\"0\" checked=\"\">Off<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"lock\" value=\"1\">On<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Manual only: blips the throttle on downshifts for smooth gear changes.\"><span>Rev-match<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"revmatch\" value=\"0\">Off<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"revmatch\" value=\"1\" checked=\"\">On<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <label class=\"slider\" data-help=\"How hard the car slows when you lift off the throttle.\"><div><span>Engine braking<\u002Fspan><span id=\"ebVal\">50%<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"ebrake\" min=\"0\" max=\"100\" value=\"50\"><\u002Flabel>\n  <\u002Fdiv>\n  <div class=\"tabpane\" data-tab=\"sound\" hidden=\"\">\n    <div class=\"vrow\" data-help=\"How many times per second a cylinder fires. Rises with RPM.\"><span>Live sound<\u002Fspan><span class=\"tag tag-neutral\" id=\"fireHz\">0 Hz firing<\u002Fspan><\u002Fdiv>\n    <div class=\"scope\" data-help=\"Live waveform of the engine sound. The tag shows how many times per second a cylinder fires.\"><canvas id=\"scope\" width=\"532\" height=\"128\"><\u002Fcanvas><\u002Fdiv>\n    <div class=\"vrow stack\" data-help=\"Where you hear the engine: behind the car, under the hood, or inside the cabin. Press L to cycle.\"><span>Listen from<\u002Fspan><div class=\"seg full\"><label class=\"seg-opt\"><input type=\"radio\" name=\"pos\" value=\"exhaust\" checked=\"\">Tailpipe<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"pos\" value=\"bay\">Engine bay<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"pos\" value=\"cabin\">Cabin<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow stack\" data-help=\"Muffler setup. Louder systems add rasp, bass and crackle.\"><span>Exhaust<\u002Fspan><div class=\"seg full\"><label class=\"seg-opt\"><input type=\"radio\" name=\"exh\" value=\"stock\" checked=\"\">Stock<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"exh\" value=\"catback\">Cat-back<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"exh\" value=\"straight\">Straight<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <div class=\"vrow\" data-help=\"Lopey gives a choppy, aggressive idle like a race cam.\"><span>Camshaft<\u002Fspan><div class=\"seg\"><label class=\"seg-opt\"><input type=\"radio\" name=\"cam\" value=\"stock\" checked=\"\">Stock<\u002Flabel><label class=\"seg-opt\"><input type=\"radio\" name=\"cam\" value=\"lopey\">Lopey<\u002Flabel><\u002Fdiv><\u002Fdiv>\n    <label class=\"slider\" data-help=\"Volume of the air rushing into the engine at high throttle.\"><div><span>Intake roar<\u002Fspan><span id=\"intVal\">50%<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"intakeR\" min=\"0\" max=\"100\" value=\"50\"><\u002Flabel>\n    <label class=\"slider\" data-help=\"Depth and rumble of the exhaust note.\"><div><span>Exhaust bass<\u002Fspan><span id=\"bassVal\">50%<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"bass\" min=\"0\" max=\"100\" value=\"50\"><\u002Flabel>\n    <label class=\"slider\" data-help=\"Pops and bangs when you lift off at high revs.\"><div><span>Overrun crackle<\u002Fspan><span id=\"crkVal\">15%<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"crackle\" min=\"0\" max=\"100\" value=\"15\"><\u002Flabel>\n    <label class=\"slider\" data-help=\"Overall sound level.\"><div><span>Volume<\u002Fspan><span id=\"volVal\">70%<\u002Fspan><\u002Fdiv><input type=\"range\" id=\"volume\" min=\"0\" max=\"100\" value=\"70\"><\u002Flabel>\n  <\u002Fdiv>\n  <div class=\"help\" id=\"help\">Point at a setting to see what it does.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card blueprint tip\" id=\"tip\" hidden=\"\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div class=\"tip-title\" id=\"tipTitle\"><\u002Fdiv><div class=\"tip-body\" id=\"tipBody\"><\u002Fdiv><\u002Fdiv>\n<div class=\"right\">\n<div class=\"card blueprint console\">\n  <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n  <div class=\"console-head\"><div class=\"card-kicker\">Engine control<\u002Fdiv><span class=\"tag tag-neutral\" id=\"status\">Off<\u002Fspan><\u002Fdiv>\n  <div class=\"cluster\">\n    <div class=\"rpm\"><span id=\"rpm\">0<\u002Fspan><small>RPM<\u002Fsmall><\u002Fdiv>\n    <div class=\"rpm\"><span id=\"mph\">0<\u002Fspan><small>MPH<\u002Fsmall><\u002Fdiv>\n    <div class=\"gear\" id=\"gearInd\">P<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"temp\" id=\"tempRow\"><span>Coolant<\u002Fspan><div class=\"tbar\"><div class=\"tfill\" id=\"tempFill\"><\u002Fdiv><i class=\"tnorm\"><\u002Fi><\u002Fdiv><b id=\"tempVal\">22°C<\u002Fb><button class=\"btn btn-ghost tbtn\" id=\"coldBtn\" type=\"button\">Cold start<\u002Fbutton><\u002Fdiv>\n  <div>\n    <div class=\"tach\" id=\"tach\"><div class=\"tach-fill\" id=\"tachFill\"><\u002Fdiv><div class=\"tach-red\"><\u002Fdiv><\u002Fdiv>\n    <div class=\"tach-ticks\"><span>0<\u002Fspan><span>1<\u002Fspan><span>2<\u002Fspan><span>3<\u002Fspan><span>4<\u002Fspan><span>5<\u002Fspan><span>6<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <svg class=\"dyno\" viewBox=\"0 0 280 72\" preserveAspectRatio=\"none\"><path class=\"tq\" id=\"tqPath\"><\u002Fpath><path class=\"hp\" id=\"hpPath\"><\u002Fpath><line class=\"mark\" id=\"dynoMark\" x1=\"0\" x2=\"0\" y1=\"0\" y2=\"72\"><\u002Fline><\u002Fsvg>\n    <div class=\"dyno-read\"><span>Torque — <b id=\"tqNow\">0<\u002Fb> lb-ft<\u002Fspan><span>Power ┄ <b id=\"hpNow\">0<\u002Fb> hp<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"ctrl-row\">\n    <button class=\"btn btn-primary blueprint\" id=\"startBtn\" type=\"button\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><span id=\"startLabel\">St u002Fspan><\u002Fbutton><button type=\"button\" data-m=\"engine\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg><span>Engine<\u002Fspan><\u002Fbutton><\u002Fnav>\n<button class=\"btn btn-secondary panels-btn\" id=\"panelsBtn\" type=\"button\">Hide panels <kbd>H<\u002Fkbd><\u002Fbutton>\n<script>\n(() => {\n  const tabs = document.querySelectorAll('input[name=tab]'), panes = document.querySelectorAll('.tabpane'), help = document.getElementById('help');\n  const DEF_HELP = help.textContent;\n  const show = v => { panes.forEach(p => p.hidden = p.dataset.tab !== v); localStorage.setItem('challenger_tab', v); help.textContent = DEF_HELP; };\n  const saved = localStorage.getItem('challenger_tab');\n  if (saved && document.querySelector('.tabpane[data-tab=\"' + saved + '\"]')) { document.querySelector('input[name=tab][value=\"' + saved + '\"]').checked = true; show(saved); }\n  tabs.forEach(r => r.addEventListener('change', () => show(r.value)));\n  const settings = document.getElementById('settings');\n  const onHelp = e => { const el = e.target.closest && e.target.closest('[data-help]'); if (el && settings.contains(el)) help.textContent = el.dataset.help; };\n  settings.addEventListener('pointerover', onHelp); settings.addEventListener('focusin', onHelp);\n  settings.addEventListener('pointerleave', () => help.textContent = DEF_HELP);\n  document.getElementById('resetTab').addEventListener('click', () => {\n    const pane = document.querySelector('.tabpane:not([hidden])');\n    pane.querySelectorAll('input[type=radio]').forEach(r => { if (r.defaultChecked && !r.checked) { r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); } });\n    pane.querySelectorAll('select').forEach(s => { cons  - 0.001, 0.024, 64), steel, g);\n  mesh(`${p.name}_flange_f`, zCyl(p.r + 0.007, 0.004, 64).translate(0, 0, 0.014), steel, g);\n  mesh(`${p.name}_flange_r`, zCyl(p.r + 0.007, 0.004, 64).translate(0, 0, -0.014), steel, g);\n  mesh(`${p.name}_hub`, zCyl(Math.min(0.025, p.r * 0.45), 0.008).translate(0, 0, 0.019), iron, g);\n}\nmesh('crank_damper_ring', zCyl(0.085, 0.03, 64).translate(0, CRANK_Y, PZ - 0.03), iron);\nmesh('crank_bolt', new THREE.CylinderGeometry(0.012, 0.012, 0.01, 6).rotateX(Math.PI / 2).translate(0, CRANK_Y, PZ + 0.027), steel);\nmesh('tensioner_arm', new THREE.BoxGeometry(0.03, 0.09, 0.012).rotateZ(0.5).translate(0.15, 0.2, FRONT + 0.045), iron);\nmesh('water_pump_housing', zCyl(0.05, 0.04).translate(-0.16, 0.42, FRONT + 0.045), aluminum);\nmesh('idler_bracket', zCyl(0.02, 0.04).translate(0, 0.49, FRONT + 0.045), aluminum);\n{\n  const alt = new THREE.Group(); alt.name = 'alternator'; alt.position.set(0.3, 0.4, 0.2); engine.add(alt);\n  mesh('alternator_body', zCyl(0.075, 0.13), steel, alt);\n  mesh('alternator_front_frame', zCyl(0.07, 0.02).translate(0, 0, 0.075), aluminum, alt);\n  for (let i = 0; i < 5; i++) mesh(`alternator_fin_${i}`, new THREE.TorusGeometry(0.076, 0.003, 8, 48).translate(0, 0, -0.05 + i * 0.025), aluminum, alt);\n  mesh('alternator_bracket', new THREE.BoxGeometry(0.1, 0.03, 0.08).translate(-0.07, -0.05, 0), aluminum, alt);\n}\n{\n  const ac = new THREE.Group(); ac.name = 'ac_compressor'; ac.position.set(-0.25, 0.2, 0.17); engine.add(ac);\n  mesh('ac_compressor_body', zCyl(0.068, 0.17), aluminum, ac);\n  mesh('ac_clutch', zCyl(0.062, 0.03).translate(0, 0, 0.1), steel, ac);\n  mesh('ac_manifold_block', new THREE.BoxGeometry(0.05, 0.03, 0.06).translate(-0.02, 0.075, -0.03), aluminum, ac);\n}\n\n// Serpentine belt: offset hull around pulleys (listed CCW)\n{\n  const T = 0.007, arcs = [];\n  const n = pulleys.length;\n  const tangentAngle = (a, b) => {\n    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);\n    return Math.atan2(dy, dx) - Math.acos((a.r - b.r) / L);\n  };\n  for (let i = 0; i < n; i++) {\n    const prev = pulleys[(i - 1 + n) % n], cur = pulleys[i], next = pulleys[(i + 1) % n];\n    let a0 = tangentAngle(prev, cur), a1 = tangentAngle(cur, next);\n    while (a1 < a0) a1 += Math.PI * 2;\n    arcs.push({ p: cur, a0, a1 });\n  }\n  const ring = (rOff) => {\n    const pts = [];\n    for (const { p, a0, a1 } of arcs) {\n      const steps = Math.max(4, Math.ceil((a1 - a0) / 0.08));\n      for (let k = 0; k <= steps; k++) {\n        const a = a0 + (a1 - a0) * k / steps;\n        pts.push(new THREE.Vector2(p.x + (p.r + rOff) * Math.cos(a), p.y + (p.r + rOff) * Math.sin(a)));\n      }\n    }\n    return pts;\n  };\n  const shape = new THREE.Shape(ring(T));\n  shape.holes.push(new THREE.Path(ring(0.0005).reverse()));\n  mesh('serpentine_belt', new THREE.ExtrudeGeometry(shape, { depth: 0.022, bevelEnabled: false }).translate(0, 0, PZ - 0.011), rubber);\n}\n\n// Dipstick\n{\n  const curve = new THREE.CatmullRomCurve3([\n    new THREE.Vector3(-0.172, 0.18, 0.12), new THREE.Vector3(-0.2, 0.3, 0.14),\n    new THREE.Vector3(-0.235, 0.45, 0.16), new THREE.Vector3(-0.24, 0.53, 0.17),\n  ]);\n  mesh('dipstick_tube', new THREE.TubeGeometry(curve, 32, 0.006, 12, false), steel);\n  mesh('dipstick_handle', new THREE.TorusGeometry(0.018, 0.005, 12, 32).rotateY(Math.PI / 2).translate(-0.24, 0.555, 0.17), accent);\n}\n\n// Coolant hose from water pump up to thermostat housing\n{\n  const curve = new THREE.CatmullRomCurve3([\n    new THREE.Vector3(-0.16, 0.47, FRONT + 0.03), new THREE.Vector3(-0.14, 0.55, FRONT + 0.02),\n    new THREE.Vector3(-0.08, 0.58, FRONT - 0.02), new THREE.Vector3(-0.07, 0.56, FRONT - 0.07),\n  ]);\n  mesh('upper_coolant_hose', new THREE.TubeGeometry(curve, 32, 0.017, 20, false), rubber);\n}\n\n\n// ================= Detail pass =================\nconst bankXY = (side, lx, ly) => { const a = -side * Math.PI / 6; return [lx * Math.cos(a) - ly * Math.sin(a), lx * Math.sin(a) + ly * Math.cos(a) + CRANK_Y]; };\nconst hexGeo = (r, len, axis) => { const g = new THREE.CylinderGeometry(r, r, len, 6); if (axis === 'z') g.rotateX(Math.PI / 2); if (axis === 'x') g.rotateZ(Math.PI / 2); return g; };\nconst bolt = (name, r, len, [x, y, z], axis = 'z', mat = steel, parent = engine) => mesh(name, hexGeo(r, len, axis).translate(x, y, z), mat, parent);\nconst tube = (name, pts, r, mat, seg = 40, radial = 16) => mesh(name, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))), seg, r, radial, false), mat);\nconst perimeterBolts = (prefix, poly, center, inset, z, pitch, keep = () => true) => {\n  let n = 0;\n  for (let i = 0; i < poly.length; i++) {\n    const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length];\n    const count = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / pitch));\n    for (let k = 0; k < count; k++) {\n      const t = (k + 0.5) / count; let x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;\n      const d = Math.hypot(x - center[0], y - center[1]); x -= (x - center[0]) / d * inset; y -= (y - center[1]) / d * inset;\n      if (keep(x, y)) bolt(`${prefix}_${n++}`, 0.0055, 0.008, [x, y, z]);\n    }\n  }\n};\n\n// Timing cover: perimeter bolts, phaser bolts, cam sensors\nperimeterBolts('timing_cover_bolt',\n  [[-0.16, 0.085], [0.16, 0.085], [0.18, 0.26], [0.275, 0.46], [0.255, 0.5], [0.09, 0.585], [-0.09, 0.585], [-0.255, 0.5], [-0.275, 0.46], [-0.18, 0.26]],\n  [0, 0.33], 0.014, FRONT + 0.033, 0.065);\nfor (const side of [-1, 1]) {\n  const tag = side > 0 ? 'R' : 'L';\n  for (const lx of [-0.05, 0.05]) {\n    const [x, y] = bankXY(side, lx, 0.265);\n    bolt(`cam_phaser_bolt_${tag}_${lx > 0 ? 'ex' : 'in'}`, 0.012, 0.01, [x, y, FRONT + 0.046]);\n    mesh(`cam_phaser_ring_${tag}_${lx > 0 ? 'ex' : 'in'}`, new THREE.TorusGeometry(0.034, 0.0025, 8, 48).translate(x, y, FRONT + 0.042), aluminum);\n  }\n  const [sx, sy] = bankXY(side, side * 0.0, 0.215);\n  mesh(`cam_sensor_${tag}`, zCyl(0.011, 0.028, 24).translate(sx, sy, FRONT + 0.044), composite);\n  mesh(`cam_sensor_plug_${tag}`, new THREE.BoxGeometry(0.022, 0.016, 0.02).translate(sx + side * 0.018, sy, FRONT + 0.05), accent);\n}\n\n// Pulleys: poly-V ribs, dust caps, damper bolts\nfor (const p of pulleys) {\n  for (const dz of [-0.008, 0, 0.008]) mesh(`${p.name}_rib_${dz}`, new THREE.TorusGeometry(p.r - 0.001, 0.0016, 6, 64).translate(p.x, p.y, PZ + dz), steel);\n}\nfor (const n of ['belt_tensioner', 'idler_pulley']) {\n  const p = pulleys.find(q => q.name === n);\n  mesh(`${n}_dust_cap`, new THREE.SphereGeometry(0.016, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2).rotateX(Math.PI / 2).translate(p.x, p.y, PZ + 0.022), steel);\n}\nfor (let i = 0; i < 4; i++) {\n  const a = i * Math.PI / 2 + Math.PI / 4;\n  bolt(`crank_damper_bolt_${i}`, 0.007, 0.008, [Math.cos(a) * 0.05, CRANK_Y + Math.sin(a) * 0.05, PZ + 0.02]);\n}\nmesh('crank_timing_ring', new THREE.TorusGeometry(0.072, 0.003, 8, 64).translate(0, CRANK_Y, PZ + 0.017), iron);\n\n// Throttle body flange + bolts\n{\n  const tb = engine.getObjectByName('throttle_body');\n  mesh('throttle_flange', zCyl(0.056, 0.008).translate(0, 0, -0.028), aluminum, tb);\n  for (let i = 0; i < 4; i++) {\n    const a = Math.PI / 4 + i * Math.PI / 2;\n    bolt(`throttle_bolt_${i}`, 0.0055, 0.01, [Math.cos(a) * 0.05, Math.sin(a) * 0.05, -0.021], 'z', steel, tb);\n  }\n  mesh('throttle_actuator_plug', new THREE.BoxGeometry(0.02, 0.022, 0.018).translate(-0.09, -0.01, 0.0), accent, tb);\n  mesh('throttle_inlet_lip', new THREE.TorusGeometry(0.038, 0.004, 12, 48).translate(0, 0, 0.034), aluminum, tb);\n}\n\n// Upper intake: parting flange, sensors, vacuum + PCV lines\n{\n  const intake = engine.getObjectByName('upper_intake');\n  mesh('plenum_parting_flange', extrudeZ(roundedRect(0.236, 0.012, 0.005), 0.41, 0.0).translate(0, 0.598, -0.01), composite, intake);\n  for (let i = 0; i < 4; i++) for (const s of [-1, 1]) {\n    bolt(`plenum_bolt_${s > 0 ? 'R' : 'L'}_${i}`, 0.005, 0.01, [s controls.addEventListener('start', () => { fly = null; document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('on')); });\n\n  // Scenes\n  const setR = (name, v) => { const r = document.querySelector('input[name=' + name + '][value=\"' + v + '\"]'); if (r && !r.checked) { r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); } };\n  const setV = (id, v) => { const el = $(id); if (el && !el.disabled && +el.value !== v) { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); } };\n  const SCENES = {\n    showroom: { r: { light: 'studio', render: 'shaded', bg: 'grid', heat: '1', block: 'polished', covers: 'silver', cut: '0', bay: '0', labels: '1', exh: 'stock', pos: 'exhaust', cam: 'stock' }, v: { explode: 0 }, cam: 'iso',\n      tip: 'Showroom: polished finish under studio light. Drag to look around.' },\n    burnout: { r: { light: 'night', render: 'shaded', heat: '1', cut: '0', bay: '1', tc: '0', lock: '1', launch: '0', exh: 'straight', pos: 'exhaust', cam: 'lopey' }, v: { explode: 0 }, cam: 'iso',\n      tip: 'Night burnout: start the engine, pick D, then hold Brake and Gas together. Watch the exhaust glow.' },\n    drag: { r: { light: 'studio', render: 'shaded', heat: '1', cut: '0', bay: '1', tc: '1', lock: '0', launch: '1', exh: 'catback', pos: 'cabin', cam: 'stock' }, v: { explode: 0 }, cam: 'side',\n      tip: 'Drag strip: pick D, hold Brake + full Gas to arm launch control, then release the brake. Times appear under Drive.' },\n    study: { r: { light: 'studio', render: 'blueprint', bg: 'grid', cut: '1', bay: '0', labels: '1' }, v: { explode: 35 }, cam: 'front',\n      tip: 'Blueprint study: cutaway and exploded line drawing. Start the engine to watch the pistons move.' },\n  };\n  document.querySelectorAll('[data-scene]').forEach(b => b.addEventListener('click', () => {\n    const s = SCENES[b.dataset.scene];\n    for (const [k, v] of Object.entries(s.r)) setR(k, v);\n    for (const [k, v] of Object.entries(s.v)) setV(k, v);\n    flyTo(s.cam);\n    document.querySelectorAll('[data-scene]').forEach(x => x.classList.toggle('on', x === b));\n    toast(s.tip); buzz(12);\n  }));\n  $('settings').addEventListener('change', e => { if (!e.isTrusted) return; document.querySelectorAll('[data-scene]').forEach(x => x.classList.remove('on')); });\n\n  // First-run guide\n  const STEPS = () => isM() ? [\n    ['Start the engine', 'Tap Start. The engine cranks, fires and settles to idle. The bar at the top shows RPM, speed and gear.'],\n    ['Rev and drive', 'Hold Gas to rev — press higher on the pedal for more throttle. Pick D and hold Gas to drive; Brake slows you down.'],\n    ['Make it yours', 'Use the tabs at the bottom for gauges, views, finishes, driving aids and sound. Try a Scene for a one-tap setup.'],\n  ] : [\n    ['Start the engine', 'Click Start engine or press S. The engine cranks, fires and settles to idle.'],\n    ['Rev and drive', 'Hold the throttle button or Space to rev. Pick D to drive; B is the brake, Q and E shift.'],\n    ['Make it yours', 'Pick a Scene for a one-tap setup, use the camera buttons at the top, and point at any setting to learn what it does.'],\n  ];\n  let step = 0;\n  const render = () => {\n    const S2 = STEPS(); $('coachStep').textContent = 'Step ' + (step + 1) + ' of ' + S2.length;\n    $('coachTitle').textContent = S2[step][0]; $('coachBody').textContent = S2[step][1];\n    $('coachNextL').textContent = step === S2.length - 1 ? 'Let’s go' : 'Next';\n    document.querySelectorAll('#coachDots i').forEach((d, i) => d.classList.toggle('on', i === step));\n  };\n  const openCoach = () => { step = 0; render(); $('coach').hidden = false; $('coachNext').focus(); };\n  const closeCoach = () => { $('coach').hidden = true; localStorage.setItem('challenger_onboarded', '1'); };\n  $('coachNext').addEventListener('click', () => { if (step < 2) { step++; render(); } else closeCoach(); });\n  $('coachSkip').addEventListener('click', closeCoach);\n  $('coach').addEventListener('click', e => { if (e.target === $('coach')) closeCoach(); });\n  addEventListener('keydown', e => { if (!$('coach').hidden && e.code === 'Escape') closeCoach(); });\n  $('helpBtn').addEventListener('click', openCoach);\n  if (!localStorage.getItem('challenger_onboarded')) setTimeout(openCoach, 600);\n\n  // Haptics: start, shifts, rev limiter\n  let lastGear = $('gearInd').textContent, lastLimit = false, lastMode = S.mode;\n  (function hap() {\n    requestAnimationFrame(hap);\n    const g = $('gearInd').textContent, lim = $('tach').classList.contains('limit');\n    if (g !== lastGear) { if (S.mode === 'running') buzz(14); lastGear = g; }\n    if (lim && !lastLimit) buzz([8, 40, 8, 40, 8]);\n    if (S.mode !== lastMode) { if (S.mode === 'cranking') buzz([20, 60, 20, 60, 20]); if (S.mode === 'running' && lastMode === 'cranking') buzz(40); lastMode = S.mode; }\n    lastLimit = lim;\n  })();\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
